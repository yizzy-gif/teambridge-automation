name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git auth for private GitHub clones
        # `package.json` references `alloy-design-system` via the
        # `github:owner/repo` shorthand, which npm rewrites to an SSH
        # clone (`ssh://git@github.com/...`). The runner has no SSH
        # key, so we redirect any SSH/HTTPS GitHub clone through the
        # PAT-authenticated HTTPS URL. The same redirect makes the
        # explicit `git clone` step below work too.
        run: |
          git config --global url."https://x-access-token:${{ secrets.ALLOY_ACCESS }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ secrets.ALLOY_ACCESS }}@github.com/".insteadOf "git@github.com:"

      - name: Clone Alloy Design System (sibling)
        # Alloy is a private sibling repo; the fine-grained PAT stored
        # as ALLOY_ACCESS has read-only Contents access scoped to that
        # repo. GitHub Actions auto-masks secret values in logs.
        run: git clone https://x-access-token:${{ secrets.ALLOY_ACCESS }}@github.com/yizzy-gif/alloy-design-system.git ${{ github.workspace }}/../Alloy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link Alloy node_modules
        run: ln -s ${{ github.workspace }}/node_modules ${{ github.workspace }}/../Alloy/node_modules

      - name: Build
        env:
          VITE_ANTHROPIC_API_KEY: ''
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
